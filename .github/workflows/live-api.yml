name: Live API Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Daily smoke test at 03:00 UTC (11:00 Beijing) — catches upstream API drift.
    - cron: "0 3 * * *"

jobs:
  providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p tokimo-providers --features live-api -- --ignored --nocapture
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
